<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Euro Motors Architecture</title>
<style>
  body { margin: 0; background: #f5f5f5; font-family: Segoe UI, Arial, sans-serif; display: flex; justify-content: center; align-items: flex-start; padding: 30px; }
  svg { background: white; border-radius: 10px; box-shadow: 0 2px 16px rgba(0,0,0,0.10); }
</style>
</head>
<body>
<svg viewBox="0 0 820 680" width="820" xmlns="http://www.w3.org/2000/svg">

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Figure 4.1 — Euro Motors System Architecture</text>

  <!-- ═══ CLIENT LAYER ═══ -->
  <rect x="30" y="50" width="760" height="80" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="50" y="70" font-size="10" font-weight="700" fill="#6c8ebf" letter-spacing="1.2">CLIENT LAYER</text>
  <rect x="230" y="78" width="360" height="42" rx="6" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.8"/>
  <text x="410" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Browser</text>
  <text x="410" y="116" text-anchor="middle" font-size="10" fill="#555">React 18 + Tailwind CSS</text>

  <!-- Arrow + label -->
  <line x1="410" y1="130" x2="410" y2="158" stroke="#aaa" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="350" y="136" width="120" height="16" rx="3" fill="#f0f0f0"/>
  <text x="410" y="148" text-anchor="middle" font-size="10" fill="#666">HTTPS</text>

  <!-- ═══ MIDDLEWARE LAYER ═══ -->
  <rect x="30" y="162" width="760" height="80" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="50" y="182" font-size="10" font-weight="700" fill="#d6b656" letter-spacing="1.2">MIDDLEWARE LAYER</text>
  <rect x="180" y="188" width="460" height="42" rx="6" fill="#ffffff" stroke="#d6b656" stroke-width="1.8"/>
  <text x="410" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Next.js Middleware</text>
  <text x="410" y="226" text-anchor="middle" font-size="10" fill="#555">JWT Guard / RBAC Enforcement</text>

  <!-- Arrows to both app boxes -->
  <line x1="270" y1="242" x2="220" y2="300" stroke="#aaa" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="550" y1="242" x2="600" y2="300" stroke="#aaa" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ═══ APPLICATION LAYER ═══ -->
  <rect x="30" y="295" width="760" height="95" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="50" y="315" font-size="10" font-weight="700" fill="#82b366" letter-spacing="1.2">APPLICATION LAYER</text>

  <!-- Left box: Server Components -->
  <rect x="55" y="322" width="300" height="52" rx="6" fill="#ffffff" stroke="#82b366" stroke-width="1.8"/>
  <text x="205" y="347" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">Server Components / Pages</text>
  <text x="205" y="364" text-anchor="middle" font-size="10" fill="#555">App Router (SSR + RSC)</text>

  <!-- Right box: API Route Handlers -->
  <rect x="465" y="322" width="300" height="52" rx="6" fill="#ffffff" stroke="#82b366" stroke-width="1.8"/>
  <text x="615" y="347" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">API Route Handlers</text>
  <text x="615" y="364" text-anchor="middle" font-size="10" fill="#555">src/app/api/**</text>

  <!-- Arrow: left box -> ORM -->
  <line x1="205" y1="374" x2="205" y2="432" stroke="#aaa" stroke-width="1.8" marker-end="url(#arr)"/>
  <!-- Arrow: right box -> ORM -->
  <line x1="615" y1="374" x2="450" y2="455" stroke="#aaa" stroke-width="1.8" marker-end="url(#arr)"/>
  <!-- Arrow: right box -> CarQuery -->
  <line x1="765" y1="355" x2="765" y2="432" stroke="#9673a6" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrd)"/>

  <!-- ═══ EXTERNAL SERVICE ═══ -->
  <rect x="665" y="435" width="200" height="52" rx="6" fill="#f8cecc" stroke="#9673a6" stroke-width="1.8" stroke-dasharray="6,3"/>
  <text x="765" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#9673a6">CarQuery API</text>
  <text x="765" y="476" text-anchor="middle" font-size="10" fill="#9673a6">External · JSONP</text>

  <!-- Label on dashed line -->
  <rect x="720" y="394" width="88" height="16" rx="3" fill="#f0e6f6"/>
  <text x="764" y="406" text-anchor="middle" font-size="10" fill="#9673a6">JSONP / HTTP</text>

  <!-- ═══ DATA ACCESS LAYER ═══ -->
  <rect x="30" y="430" width="620" height="80" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text x="50" y="450" font-size="10" font-weight="700" fill="#d79b00" letter-spacing="1.2">DATA ACCESS LAYER</text>
  <rect x="130" y="456" width="420" height="42" rx="6" fill="#ffffff" stroke="#d79b00" stroke-width="1.8"/>
  <text x="340" y="481" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Prisma ORM</text>

  <!-- Arrow ORM -> SQLite -->
  <line x1="340" y1="510" x2="340" y2="558" stroke="#aaa" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ═══ DATABASE LAYER ═══ -->
  <rect x="30" y="560" width="620" height="90" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="50" y="580" font-size="10" font-weight="700" fill="#b85450" letter-spacing="1.2">DATABASE LAYER</text>

  <!-- Cylinder (SQLite) -->
  <ellipse cx="340" cy="600" rx="120" ry="12" fill="#ffffff" stroke="#b85450" stroke-width="1.8"/>
  <rect x="220" y="600" width="240" height="35" fill="#ffffff" stroke="none"/>
  <line x1="220" y1="600" x2="220" y2="635" stroke="#b85450" stroke-width="1.8"/>
  <line x1="460" y1="600" x2="460" y2="635" stroke="#b85450" stroke-width="1.8"/>
  <ellipse cx="340" cy="635" rx="120" ry="12" fill="#ffffff" stroke="#b85450" stroke-width="1.8"/>
  <text x="340" y="621" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">SQLite  (dev.db)</text>

  <!-- Legend -->
  <rect x="32" y="660" width="14" height="10" rx="2" fill="#f8cecc" stroke="#9673a6" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="52" y="669" font-size="10" fill="#9673a6">External service (dashed)</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#aaa"/>
    </marker>
    <marker id="arrd" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9673a6"/>
    </marker>
  </defs>
</svg>
</body>
</html>
